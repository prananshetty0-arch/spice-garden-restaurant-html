 <body>
    <h1 align="center">Reserve a Table</h1>

    <hr>

    <h2 align="center">Book Your Table</h2>

    <form>

        <table border="1" cellpadding="10" align="center">

            <tr>
                <td>
                    <label>
                        Full Name:
                        <input type="text" name="fullname" required>
                    </label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>
                        Email:
                        <input type="email" name="email" required>
                    </label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>
                        Phone:
                        <input type="tel" name="phone">
                    </label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>
                        Date of Visit:
                        <input type="date" name="date" required>
                    </label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>
                        Time:
                        <input type="time" name="time">
                    </label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>
                        Number of Guests:

                        <select name="guests">
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>
                        </select>

                    </label>
                </td>
            </tr>

            <tr>
                <td>
                    <label>
                        Special Requests:
                        <textarea name="requests" rows="5" cols="25"></textarea>
                    </label>
                </td>
            </tr>

            <tr>
                <td align="center">
                    <button type="submit">Submit</button>
                </td>
            </tr>

        </table>

    </form>
